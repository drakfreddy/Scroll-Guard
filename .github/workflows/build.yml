name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          rm -rf proj && mkdir proj
          unzip -q ScrollGuard.zip -d proj
          cd proj/ScrollGuard
          gradle assembleDebug --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp proj/ScrollGuard/app/build/outputs/apk/debug/app-debug.apk out/
      - uses: actions/upload-artifact@v4
        with:
          name: ScrollGuard-APK
          path: out/app-debug.apk
